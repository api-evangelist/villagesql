aid: villagesql
name: VillageSQL
description: >-
  VillageSQL is an open-source, drop-in replacement for MySQL 8.4 that adds an
  extension framework (VEF) for custom SQL functions, custom data types, and
  custom indexes — capabilities MySQL lacks natively. Extensions install at
  runtime via SQL (INSTALL EXTENSION) with no server restart, and official
  extensions cover AI prompting and embeddings, UUIDs, crypto, network address
  types, HTTP clients, vectors, trigram search, and an embedded REST server. It
  is distributed as a server binary, Docker image, and one-line installer, with
  a Rust VEF SDK, C++/Rust extension templates, and provider-published agent
  skills.
